services:
  financa:
    container_name: financa-app
    image: ${IMAGE_NAME:-ghcr.io/centrafin/financa}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Expose sur l'hôte. En production derrière Nginx/Caddy sur le VPS,
      # vous pouvez restreindre à '127.0.0.1:${PORT:-4000}:4000'
      - "${PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - financa-net

networks:
  financa-net:
    driver: bridge
